    <!-- Schema.org Structured Data -->

    <!-- Fonts: Plus Jakarta Sans (Display), DM Sans (Body), JetBrains Mono (Code/Data) -->

    />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('subhajit-theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
